# /etc/nginx/sites-available/filcensus
#
# Public dashboard: filcensus.reiers.io
# Push endpoint:    ingest.filcensus.reiers.io
#
# Drop in /etc/nginx/sites-available/filcensus
# ln -sf /etc/nginx/sites-available/filcensus /etc/nginx/sites-enabled/
# certbot --nginx -d filcensus.reiers.io -d ingest.filcensus.reiers.io
# nginx -t && systemctl reload nginx

# ============================================================
# Public dashboard
# ============================================================
server {
    listen 80;
    server_name filcensus.reiers.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name filcensus.reiers.io;

    ssl_certificate /etc/letsencrypt/live/filcensus.reiers.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filcensus.reiers.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "interest-cohort=()" always;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/html text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    root /var/lib/filcensus/site;
    index index.html;

    # JSON snapshots are mirrored under /data/
    location /data/ {
        alias /var/lib/filcensus/snapshots/;
        autoindex on;
        autoindex_format html;
        add_header Cache-Control "public, max-age=300";
    }

    # Aggressive caching for static assets
    location ~* \.(css|js|png|svg|webp|jpg|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Short TTL for HTML
    location = / {
        add_header Cache-Control "public, max-age=300";
        try_files /index.html =404;
    }
    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/filcensus.access.log;
    error_log  /var/log/nginx/filcensus.error.log;
}

# ============================================================
# Ingest endpoint (mainnet node POSTs snapshots here)
# ============================================================
server {
    listen 80;
    server_name ingest.filcensus.reiers.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ingest.filcensus.reiers.io;

    ssl_certificate /etc/letsencrypt/live/filcensus.reiers.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filcensus.reiers.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Hard upload limit (defense in depth; daemon also caps at 50MB)
    client_max_body_size 60M;

    # filcensusd listens on localhost; bearer auth handled by the daemon itself.
    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    access_log /var/log/nginx/filcensus-ingest.access.log;
    error_log  /var/log/nginx/filcensus-ingest.error.log;
}
