<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="filcensus">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5cb8ff"/>
      <stop offset="1" stop-color="#8b5cff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <!-- background tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- radar pulses (3 concentric arcs at top-right, faint) -->
  <g stroke="#fff" stroke-opacity="0.22" stroke-width="1.5" fill="none">
    <path d="M48 32 a16 16 0 0 1 -16 16"/>
    <path d="M52 32 a20 20 0 0 1 -20 20"/>
    <path d="M56 32 a24 24 0 0 1 -24 24"/>
  </g>
  <!-- bar chart bars (the "census" half) -->
  <g fill="url(#ring)">
    <rect x="14" y="36" width="6"  height="14" rx="1.2"/>
    <rect x="22" y="28" width="6"  height="22" rx="1.2"/>
    <rect x="30" y="22" width="6"  height="28" rx="1.2"/>
    <rect x="38" y="32" width="6"  height="18" rx="1.2"/>
  </g>
  <!-- ping dot at top-right -->
  <circle cx="48" cy="20" r="3.5" fill="#fff"/>
  <circle cx="48" cy="20" r="6.5" fill="#fff" fill-opacity="0.18"/>
</svg>
